name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Build
        run: CGO_ENABLED=1 go build ./cmd/defn/

      - name: Unit tests
        # 15m, not 10m: CI intentionally runs the FULL suite (no -short,
        # unlike .githooks/pre-push) including every Fuzz corpus's full
        # replay -- that corpus only ever grows over time (one seed per
        # crasher ever found, permanent), so this runtime has no
        # ceiling and 10m already proved too tight once for the local
        # hook. Extra margin here since a GitHub-hosted runner isn't
        # necessarily faster than a dedicated box either.
        run: CGO_ENABLED=1 go test ./... -count=1 -timeout 15m

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Self-hosting round-trip
        env:
          DEFN_DB: .defn
        run: |
          EMIT_DIR=$(mktemp -d)
          ./defn ingest .
          ./defn emit "$EMIT_DIR"
          cd "$EMIT_DIR" && go build ./cmd/defn/
